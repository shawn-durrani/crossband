name: Bug report
description: Something didn't work the way the docs say it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Please **redact anything personal** from transcripts before
        pasting — replace real names/places with placeholders. Timestamps,
        error text, and which model was speaking are the useful bits.

        Security problem? Don't open an issue — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Plain words are perfect. "GPT answered twice and Claude went silent" is a great report.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where were you?
      options:
        - Desktop browser
        - Phone (over Tailscale)
        - Voice call (desktop)
        - Voice call (phone / in the car)
    validations:
      required: true
  - type: textarea
    id: voice
    attributes:
      label: If it's a voice bug
      description: |
        What you said (roughly), what the app showed (Listening / Thinking /
        Holding N…), and whether you tapped mute or talked over a model
        around that moment. Bad/no connectivity at the time is worth noting —
        that path has special handling.
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I've redacted real names, places, and personal content from this report.
          required: true
