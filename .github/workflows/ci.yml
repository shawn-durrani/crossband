name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Keyless on purpose: the suite mocks all network and must never need
      # provider credentials.
      - run: env -u OPENAI_API_KEY -u ANTHROPIC_API_KEY python -m pytest tests/ -q
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Frontend invariant: the cross-chat write-guard. Pure and
      # dependency-free, on Node's built-in runner, no extra toolchain.
      - run: node --test frontend/src/*.test.js
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --strict
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: cd frontend && npm ci --omit=dev --ignore-scripts && npm audit --omit=dev --audit-level=high
