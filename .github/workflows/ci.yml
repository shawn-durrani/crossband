name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Keyless on purpose: the suite mocks all network and must never need
      # provider credentials.
      - run: env -u OPENAI_API_KEY -u ANTHROPIC_API_KEY python -m pytest tests/ -q
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Frontend invariant: the cross-chat write-guard. Pure and
      # dependency-free, on Node's built-in runner, no extra toolchain.
      # no-undef lint first (the 2026-08-14 blank-chat regression: free
      # identifiers pass the bundler and the pure-module tests, then blank
      # every chat at runtime)
      - run: cd frontend && npm ci --ignore-scripts && npm run lint
      - run: node --test frontend/src/*.test.js
      # the render smoke: mounts the REAL message list against fixture
      # messages - any render-time crash fails CI instead of blanking
      # every chat in production (2026-08-14)
      - run: cd frontend && node scripts/render-smoke.mjs
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --strict
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: cd frontend && npm ci --omit=dev --ignore-scripts
      # npm audit asks the registry's advisory service for the lockfile's
      # known vulnerabilities. When that service is down the command fails
      # with "audit endpoint returned an error" even though it found
      # nothing, and on 4 September that blocked a green PR for two hours
      # (#341). Three attempts a minute apart ride out a short outage; a
      # long one still fails the job, by the owner's decision, so the
      # policy stays fail-closed.
      - name: npm audit, with retries for a registry outage
        run: |
          cd frontend
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm audit attempt $attempt failed; retrying in 60s"
              sleep 60
            fi
          done
          echo "npm audit failed on all three attempts"
          exit 1
